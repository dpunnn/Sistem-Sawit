services:
  db:
    image: postgres:16-alpine
    container_name: neraca-db
    environment:
      POSTGRES_USER: neraca
      POSTGRES_PASSWORD: neraca
      POSTGRES_DB: neraca
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neraca -d neraca"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build:
      # Context = root repo, karena image butuh backend/ DAN ai/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: neraca-backend
    environment:
      DATABASE_URL: postgresql://neraca:neraca@db:5432/neraca
      WEIGHTS_DIR: /app/ai/weights
      COEFFICIENTS_PATH: /app/ai/config/coefficients.yaml
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ai/weights:/app/ai/weights:ro
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    # start_period panjang karena warm-up memuat dua bobot model. Tanpa
    # itu, healthcheck menyatakan gagal justru saat container sedang
    # melakukan hal yang benar.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    container_name: neraca-frontend
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
